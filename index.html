const K=(y,m,d)=>y+'-'+P(m+1)+'-'+P(d),now=new Date(),TY=now.getFullYear(),TM=now.getMonth(),TD=now.getDate(),TK=K(TY,TM,TD);
const DK=i=>{const t=new Date(TY,TM,TD-i);return K(t.getFullYear(),t.getMonth(),t.getDate())};
let vy=TY,vm=TM,dm=false,pend=null,pt,pb=null,pbt,mode=null,cy=TY,cm=TM,hr=30,ao=0;
const done=(k,id)=>(S.l[k]||[]).includes(id);
const isx=(k,id)=>(S.ex[k]||[]).includes(id);
const act=k=>S.h.filter(h=>!isx(k,h.id));
const pct=k=>{const a=act(k);return a.length?a.filter(h=>done(k,h.id)).length/a.length:null};
function toggle(k,id){let a=S.l[k]||[];S.l[k]=a.includes(id)?a.filter(x=>x!=id):[...a,id];save();draw()}
function setx(k,id){let a=S.ex[k]||[];a=a.includes(id)?a.filter(x=>x!=id):[...a,id];if(a.length)S.ex[k]=a;else delete S.ex[k];save();draw()}
function chart(y,m,W,H,full){const dim=new Date(y,m+1,0).getDate(),L=full?46:4,R=full?16:4,T=full?16:6,B=full?30:6,pts=[],X=d=>L+(d-1)/Math.max(1,dim-1)*(W-L-R);let s=0,v='';
for(let d=1;d<=dim;d++){const k=K(y,m,d),q=pct(k);if(k<=TK&&q!==null){pts.push([X(d),T+(1-q)*(H-T-B)]);s+=q}}
if(full){[0,50,100].forEach(g=>{const yy=T+(1-g/100)*(H-T-B);v+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2a2a"/><text x="0" y="'+(yy+4)+'" fill="#8a8a8a" font-size="12">'+g+'%</text>'});
for(let d=1;d<=dim;d+=d==1?4:5)v+='<text x="'+X(d)+'" y="'+(H-8)+'" fill="#8a8a8a" font-size="12" text-anchor="middle">'+d+'</text>'}
if(pts.length)v+='<polyline fill="none" stroke="#f5e9c8" stroke-width="2.5" vector-effect="non-scaling-stroke" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+(full?pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#e63946"/>').join(''):'');
return{svg:v,avg:pts.length?Math.round(s/pts.length*100):0}}
function bars(rg,o,lim,big){const L=lim?S.h.slice(0,lim):S.h;return L.map(h=>{let c=0,n=0;for(let i=0;i<rg;i++){const k=DK(o*rg+i);if(isx(k,h.id))continue;n++;if(done(k,h.id))c++}
const p=n?Math.round(c/n*100):0;return '<div class="ln"><span>'+esc(h.name)+'</span><span class="mt">'+p+'%'+(big?' · '+c+'/'+n:'')+'</span></div><div class="bar'+(big?' bg':'')+'"><i style="width:'+p+'%"></i></div>'}).join('')||'<span class="mt">Sem hábitos.</span>'}
function sumN(){let tot=0,dn=0;S.nb.forEach(b=>b.items.forEach(i=>{if(i.type=='check'){tot++;if(i.done)dn++}}));
const p=tot?Math.round(dn/tot*100):0;
$('ns').innerHTML=S.nb.length?'<div class="big">'+dn+'/'+tot+'</div><div class="mt" style="margin-bottom:8px">tarefas concluídas</div><div class="bar"><i style="width:'+p+'%"></i></div>'+S.nb.slice(0,4).map(b=>{const c=b.items.filter(i=>i.type=='check');return '<div class="ln"><span>'+esc(b.title||'Sem título')+'</span><span class="mt">'+c.filter(i=>i.done).length+'/'+c.length+'</span></div>'}).join(''):'<div class="mt">Toque para criar blocos de metas, tarefas e anotações.</div>'}
function nbHtml(b){const cs=b.items.filter(i=>i.type=='check');return '<div class="nb'+(b.min?' mn':'')+'"><div class="nh"><button class="rm mb2" data-n="min" data-b="'+b.id+'" aria-label="'+(b.min?'Expandir':'Minimizar')+'" title="'+(b.min?'Expandir':'Minimizar')+'">'+(b.min?'▸':'▾')+'</button><input class="nt" data-f="title" data-b="'+b.id+'" placeholder="Título do bloco" maxlength="60" value="'+esc(b.title)+'">'+(b.min&&cs.length?'<span class="mt">'+cs.filter(i=>i.done).length+'/'+cs.length+'</span>':'')+'<button class="x'+(pb==b.id?' cf':'')+'" data-n="del" data-b="'+b.id+'">'+(pb==b.id?'Confirmar':'Excluir')+'</button></div>'+
(b.min?[]:b.items).map((it,i)=>{const a='data-f="item" data-b="'+b.id+'" data-i="'+i+'"',rm='<button class="rm" data-n="rm" data-b="'+b.id+'" data-i="'+i+'" aria-label="Remover linha">×</button>';
if(it.type=='check')return '<div class="it'+(it.done?' dn':'')+'"><input type="checkbox" data-f="chk" data-b="'+b.id+'" data-i="'+i+'"'+(it.done?' checked':'')+'><input class="tx" '+a+' placeholder="Tarefa" value="'+esc(it.t)+'">'+rm+'</div>';
if(it.type=='head')return '<div class="it"><input class="tx hd" '+a+' placeholder="Subtítulo" value="'+esc(it.t)+'">'+rm+'</div>';
return '<div class="it"><textarea class="tx" rows="2" '+a+' placeholder="Anotação">'+esc(it.t)+'</textarea>'+rm+'</div>'}).join('')+
(b.min?'':'<div class="ad"><button data-n="add" data-t="check" data-b="'+b.id+'">+ Tarefa</button><button data-n="add" data-t="text" data-b="'+b.id+'">+ Nota</button><button data-n="add" data-t="head" data-b="'+b.id+'">+ Subtítulo</button></div>')+'</div>'}
function nact(D){const B=S.nb.find(b=>b.id==D.b);
if(D.n=='new'){if(S.nb.length<6)S.nb.push({id:Date.now()+S.nb.length,title:'',items:[{t:'',type:'check',done:false}]})}
else if(D.n=='del'){if(pb==D.b){S.nb=S.nb.filter(b=>b.id!=D.b);pb=null}else{pb=D.b;clearTimeout(pbt);pbt=setTimeout(()=>{pb=null;if(mode=='n')mdraw()},3500)}}
else if(B&&D.n=='add')B.items.push({t:'',type:D.t,done:false});
else if(B&&D.n=='rm')B.items.splice(+D.i,1);
else if(B&&D.n=='min')B.min=!B.min;
save();mdraw();sumN();
if(D.n=='add'){const L=$('mb').querySelectorAll('.nb[data-b="'+D.b+'"] .tx');if(L&&L.length)L[L.length-1].focus()}
}
const PL=a=>a.map(p=>p.join(',')).join(' ');
const star=(n,ro,ri)=>{const r=[];for(let i=0;i<2*n;i++){const a=(-90+i*180/n)*Math.PI/180,q=i%2?ri:ro;r.push([32+q*Math.cos(a),32+q*Math.sin(a)])}return r};
const SH=[[[20,4],[44,4],[60,20],[60,44],[44,60],[20,60],[4,44],[4,20]],[[32,3],[58,18],[58,46],[32,61],[6,46],[6,18]],[[32,2],[60,32],[32,62],[4,32]],[[32,3],[61,25],[50,59],[14,59],[3,25]],[[6,6],[58,6],[58,38],[32,62],[6,38]],star(6,31,19),[[32,1],[56,22],[44,62],[20,62],[8,22]],[[4,10],[18,22],[32,4],[46,22],[60,10],[54,46],[32,62],[10,46]],star(12,31,23)];
function badge(t,st){const T=TIERS[t],o=SH[t],i=o.map(p=>[32+(p[0]-32)*.62,32+(p[1]-32)*.62]),extra=t==5?'<g fill="#b9dcff" opacity=".8"><circle cx="14" cy="19" r="1.2"/><circle cx="49" cy="14" r=".9"/><circle cx="52" cy="39" r="1.1"/><circle cx="19" cy="48" r=".8"/></g>':t==7?'<polygon points="'+PL(o)+'" fill="url(#carbon)" opacity=".72"/>':t==8?'<g fill="#fff7cd"><circle cx="13" cy="24" r="1"/><circle cx="50" cy="17" r="1.2"/><circle cx="47" cy="48" r=".8"/></g>':'';
return '<svg viewBox="0 0 64 64" class="bd badge-state-'+st+'"><defs><linearGradient id="tier'+t+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+T[1]+'"/><stop offset="1" stop-color="'+T[2]+'"/></linearGradient><pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#57121d" stroke-width="2"/><path d="M-2 6L2 10M0 0L8 8M6-2L10 2" stroke="#0a0b0e" stroke-width="2"/></pattern></defs><polygon points="'+PL(o)+'" fill="url(#tier'+t+')" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linejoin="round"/>'+extra+'<polygon points="'+PL(i)+'" fill="rgba(0,0,0,.32)"/><polygon points="'+PL(star(4,11,3.5))+'" fill="'+(t==8?'#f7dc80':'#fff')+'"/></svg>'}
function mdraw(){const M=$('md');M.classList.toggle('o',!!mode);if(!mode)return;let ttl,ctl,bd;
if(mode=='m'){const c=chart(cy,cm,900,360,true),nx=cy==TY&&cm==TM;ttl='Constância no mês';
ctl='<button data-a="pm" aria-label="Mês anterior">‹</button><b style="min-width:150px;text-align:center">'+new Date(cy,cm,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</b><button data-a="nm" aria-label="Próximo mês"'+(nx?' disabled':'')+'>›</button>';
bd='<div class="big">'+c.avg+'%</div><div class="mt" style="margin-bottom:10px">média do mês</div><svg viewBox="0 0 900 360" style="width:100%;max-height:60vh">'+c.svg+'</svg>'}
else if(mode=='v'){const X=xpState(),ti=tier(X.lv);ttl='Níveis e patentes';ctl='<span class="mt">'+X.xp+' XP total</span>';
bd='<div class="vs"><div style="width:76px">'+badge(ti,'c')+'</div><div><div class="big">'+rank(X.lv)+'</div><div class="mt">Nível '+X.lv+' · faltam '+(need(X.lv)-X.r)+' XP para o próximo</div></div><div class="bar bg" style="flex:1;min-width:200px"><i style="width:'+X.r/need(X.lv)*100+'%"></i></div></div><div class="rg">'+TIERS.map((T,t)=>{const et=t==8;let c='';
if(et){const on=X.lv>=81;c=badge(8,on?'c':'l')+'<div class="rb">'+(on?'Nível '+X.lv:'Nível 81+')+'</div>'}
else{const a=t*10+1,b=a+9,st=X.lv>b?'r':X.lv>=a?'c':'l';c='<div style="width:100%" title="'+T[0]+' · níveis '+a+'–'+b+' · '+cum(a)+' XP">'+badge(t,st)+'<div class="rb">Níveis '+a+'–'+b+'</div></div>'}return '<div class="rc'+(t==ti?' cur':'')+(et?' et':'')+'" style="--tc:'+(t==7?'#e63946':T[1])+'"><h3>'+T[0]+'</h3>'+c+'</div>'}).join('')+'</div>'}
else if(mode=='n'){ttl='Metas, tarefas e objetivos';ctl='<span class="mt">'+S.nb.length+'/6 blocos</span><button data-n="new"'+(S.nb.length>=6?' disabled':'')+'>Novo bloco</button>';
bd=S.nb.length?'<div class="ng">'+S.nb.map(nbHtml).join('')+'</div>':'<p class="mt">Crie seu primeiro bloco para anotar metas, tarefas e objetivos (até 6 blocos).</p>'}
else{const f=dt=>P(dt.getDate())+'/'+P(dt.getMonth()+1),a=new Date(TY,TM,TD-(ao*hr+hr-1)),b=new Date(TY,TM,TD-ao*hr);ttl='Constância por hábito';
ctl=[[7,'1 semana'],[30,'1 mês'],[90,'3 meses']].map(r=>'<button data-r="'+r[0]+'"'+(hr==r[0]?' class="on"':'')+'>'+r[1]+'</button>').join('')+'<button data-a="ph" aria-label="Período anterior">‹</button><b style="min-width:120px;text-align:center">'+f(a)+' – '+f(b)+'</b><button data-a="nh" aria-label="Próximo período"'+(ao==0?' disabled':'')+'>›</button>';
bd=bars(hr,ao,0,true)}
$('mb').innerHTML='<div class="mh"><div class="ctl"><button class="bk" data-a="x" aria-label="Voltar">← Voltar</button><h2 class="tt">'+ttl+'</h2></div><div class="ctl">'+ctl+'</div></div>'+bd}
const TIERS=[['Iron','#777777','#333333','#fff'],['Bronze','#a66b35','#4b2a16','#fff'],['Steel','#f4f7fb','#818c9a','#111'],['Platinum','#b9e4ff','#2767b2','#111'],['Titanium','#e1c4ff','#612b91','#fff'],['Vibranium','#17213a','#02040d','#fff'],['Adamantium','#f3ffff','#6cbcff','#12304a'],['Immortal','#64101b','#08090d','#fff'],['Eternal','#fffce8','#d5a629','#392600']];
const need=l=>Math.round(100*Math.pow(1.05,l-1)),tier=l=>Math.min(8,Math.floor((l-1)/10)),rank=l=>TIERS[tier(l)][0];
const cum=l=>{let t=0;for(let i=1;i<l;i++)t+=need(i);return t};
function xpState(){let xp=0;for(const k in S.l)xp+=S.l[k].filter(i=>S.h.some(h=>h.id==i)).length*10;let lv=1,r=xp;while(r>=need(lv)){r-=need(lv);lv++}return{xp,lv,r}}
function draw(){
const dim=new Date(vy,vm+1,0).getDate();
$('mn').textContent=new Date(vy,vm,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
$('dof').classList.toggle('on',dm);$('hint').style.display=dm?'block':'none';$('hint').textContent='Day off ligado: toque num dia de um hábito para ele ficar dourado e não contar na porcentagem. Toque de novo para desfazer. Clique em "Day off" para sair.';
// matriz
let t='<tr><td class="n"></td>';for(let d=1;d<=dim;d++)t+='<th>'+d+'</th>';t+='</tr>';let mobile='<div class="mobile-weekdays"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div>';const offset=(new Date(vy,vm,1).getDay()+6)%7;
S.h.forEach(h=>{t+='<tr><td class="n">'+esc(h.name)+'<button class="x'+(pend==h.id?' cf':'')+'" data-del="'+h.id+'">'+(pend==h.id?'Confirmar':'Excluir')+'</button></td>';let cells='';for(let z=0;z<offset;z++)cells+='<span class="empty-day"></span>';
for(let d=1;d<=dim;d++){const k=K(vy,vm,d),g=isx(k,h.id),fut=k>TK&&!dm&&!g,cls='c'+(g?' g':done(k,h.id)?' d':'')+(fut?' f':'')+(k==TK?' t':'');t+='<td><button class="'+cls+'"'+(fut?' disabled':'')+' data-k="'+k+'" data-i="'+h.id+'" aria-label="'+esc(h.name)+' dia '+d+'"></button></td>';cells+='<button class="c '+(g?'g':done(k,h.id)?'d':'')+(fut?' f':'')+(k==TK?' t':'')+'"'+(fut?' disabled':'')+' data-k="'+k+'" data-i="'+h.id+'" aria-label="'+esc(h.name)+' dia '+d+'">'+d+'</button>'}
t+='</tr>';mobile+='<section class="mobile-habit"><div class="mobile-habit-head"><strong>'+esc(h.name)+'</strong><button class="x'+(pend==h.id?' cf':'')+'" data-del="'+h.id+'">'+(pend==h.id?'Confirmar':'Excluir')+'</button></div><div class="mobile-days">'+cells+'</div></section>'});
$('mx').innerHTML=S.h.length?t:'<tr><td class="n mt">Adicione seu primeiro hábito acima.</td></tr>';$('mobileMx').innerHTML=S.h.length?mobile:'<p class="mt">Adicione seu primeiro hábito acima.</p>';// hoje
const ac=act(TK),tp=Math.round((pct(TK)||0)*100);
$('tp').textContent=tp+'%';$('tc').textContent=ac.filter(h=>done(TK,h.id)).length+' de '+ac.length;$('rg').setAttribute('stroke-dashoffset',226*(1-tp/100));
// semana
const dow=(now.getDay()+6)%7,L='SMTQQSS';let w='',ws=0,wn=0;
for(let i=0;i<7;i++){const dt=new Date(TY,TM,TD-dow+i),k=K(dt.getFullYear(),dt.getMonth(),dt.getDate()),q=k<=TK?pct(k):null,p=q||0;if(q!==null){ws+=p;wn++}
w+='<div class="'+(k==TK?'h':'')+'"><i style="height:calc(var(--wh)*'+Math.max(.06,p)+')"></i>'+L[i]+'</div>'}
$('wk').innerHTML=w;$('wp').textContent=Math.round(wn?ws/wn*100:0)+'% de média';
// tendência
const c=chart(vy,vm,300,80,false);$('tr').innerHTML=c.svg;$('tm').textContent='média do mês: '+c.avg+'%';
$('an').innerHTML=(S.h.length?bars(30,0,4,false):'')+(S.h.length>4?'<div class="mt" style="margin-top:8px">+'+(S.h.length-4)+' hábitos</div>':'');
if(mode&&mode!='n')mdraw();sumN();
// XP
const X=xpState();$('lv').textContent=rank(X.lv);$('ls').textContent='Nível '+X.lv;$('lb').innerHTML=badge(tier(X.lv),'c');$('xb').style.width=X.r/need(X.lv)*100+'%';$('xt').textContent=X.r+' / '+need(X.lv)+' XP';$('xn').textContent=X.xp+' XP total';
}
const habitClick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
if(D.del){const id=+D.del;if(pend==id){S.h=S.h.filter(h=>h.id!=id);pend=null;save()}else{pend=id;clearTimeout(pt);pt=setTimeout(()=>{pend=null;draw()},3500)}draw()}
else if(D.k){const i=+D.i;if(dm||isx(D.k,i))setx(D.k,i);else toggle(D.k,i)}};$('mx').onclick=habitClick;$('mobileMx').onclick=habitClick;$('dof').onclick=()=>{dm=!dm;draw()};
$('ad').onclick=()=>{const n=$('nh').value.trim();if(!n)return;S.h.push({id:Date.now(),name:n});$('nh').value='';save();draw()};
$('nh').onkeydown=e=>{if(e.key=='Enter')$('ad').click()};
$('pv').onclick=()=>{vm--;if(vm<0){vm=11;vy--}draw()};$('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}draw()};
$('oM').onclick=()=>{mode='m';cy=vy;cm=vm;mdraw()};
$('oH').onclick=()=>{mode='h';ao=0;mdraw()};
$('oN').onclick=()=>{mode='n';mdraw()};
$('oV').onclick=()=>{mode='v';mdraw()};
$('mb').addEventListener('input',e=>{const t=e.target,D=t.dataset,B=S.nb.find(b=>b.id==D.b);if(!B)return;
if(D.f=='title')B.title=t.value;else if(D.f=='item'&&B.items[+D.i])B.items[+D.i].t=t.value;else return;save()});
$('mb').addEventListener('change',e=>{const t=e.target,D=t.dataset;if(D.f!='chk')return;const B=S.nb.find(b=>b.id==D.b);if(!B)return;B.items[+D.i].done=t.checked;t.closest('.it').classList.toggle('dn',t.checked);save();sumN()});
$('md').onclick=e=>{if(e.target===$('md')){mode=null;mdraw();return}const b=e.target.closest('button');if(!b)return;const D=b.dataset;
if(D.n){nact(D);return}if(D.a=='x')mode=null;else if(D.a=='pm'){cm--;if(cm<0){cm=11;cy--}}else if(D.a=='nm'){cm++;if(cm>11){cm=0;cy++}}else if(D.a=='ph')ao++;else if(D.a=='nh')ao=Math.max(0,ao-1);else if(D.r){hr=+D.r;ao=0}
mdraw()};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&mode){mode=null;mdraw()}});
const placeToday=()=>{const c=document.querySelector('.today-mini');if(!c)return;if(matchMedia('(max-width:900px)').matches){$('oH').parentElement.append(c)}else{$('oV').after(c)}};window.addEventListener('resize',placeToday);placeToday();draw();
</script></body></html>
